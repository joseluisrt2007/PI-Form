<!DOCTYPE html>
<html lang="es">
<head>
    <!--
        PÁGINA: descripcion.html
        PROPÓSITO: datos generales del proyecto (nombre y descripción) y selección de los módulos que se van a realizar.
        POSICIÓN EN EL FLUJO (js/core/flow.js, FLOW_STEPS): primer paso de FLOW_STEPS (modulo "siempre"). Lo que se elija aquí (projectData.modulosSeleccionados) decide qué páginas siguientes aparecen en el flujo y qué secciones lleva el PDF.
        CSS (en este orden): css/base.css primero (variables, cabecera, botones, tema oscuro) y después css/pages/descripcion.css con lo específico de la página; el segundo puede sobrescribir al primero, por eso no se invierten.
        SCRIPTS (al final del body, en orden de dependencia; ver el comentario antes de ellos): i18n/es.js, i18n/en.js, js/core/{i18n,storage,theme,flow,page}.js y js/pages/descripcion.js.
        MÓDULOS DE LOS QUE DEPENDE: PFM.i18n, PFM.storage, PFM.theme, PFM.flow y PFM.page (js/core/). Escribe projectName, projectDescription, numCriterios y modulosSeleccionados, que leen flow.js, el resto de páginas y el PDF.
        TEXTOS: los elementos con data-i18n o data-i18n-placeholder usan una clave de i18n/es.js e i18n/en.js; el texto escrito en este HTML es solo el valor por defecto antes de traducir y puede diferir del texto final.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        data-i18n="criteria_weights" en el <title>: js/core/i18n.js reemplaza el texto de la pestaña con esa clave (i18n/es.js e i18n/en.js); el texto de aquí es el valor por defecto. Nota: la clave heredada es criteria_weights (en es.js: "Necesidades y prioridades"), no la de esta página.
    -->
    <title data-i18n="criteria_weights">Criterios - Actividades de Mejora</title>
    <!--
        Fuente Roboto desde Google Fonts: los dos preconnect y el link de la hoja aceleran la descarga; requiere Internet, sin conexión el navegador usa una fuente alternativa.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- css/base.css va ANTES que la hoja propia de la página (la de la página sobrescribe a la base). -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/descripcion.css">
</head>
<body>
    <!--
        CABECERA común a las páginas: tres zonas (izquierda reservada, centro con título y nombre de proyecto, derecha con tema e idioma). Estilos en css/base.css.
    -->
    <header role="banner">
        <div class="header-left">
            <!-- Espacio reservado para alineación -->
        </div>
        
        <!-- Zona central: título de la aplicación y nombre del proyecto en curso. -->
        <div class="header-center">
            <!--
                data-i18n="app_title": clave en i18n/es.js e i18n/en.js; el texto de aquí es el valor por defecto y se sustituye al traducir.
            -->
            <div class="app-title" data-i18n="app_title">Desarrollo de Formularios para Actividades de Mejora</div>
            <!--
                id="projectNameDisplay": contenedor del nombre de proyecto; ningún JS lo usa, solo css/base.css (.project-name-container).
            -->
            <div class="project-name-container" id="projectNameDisplay">
                <!--
                    data-i18n="project": etiqueta "Proyecto:" (clave en i18n/es.js e i18n/en.js). id="projectNameText": lo escribe js/core/page.js (updateProjectName) con projectData.projectName o "(Sin nombre)" traducido (clave unnamed_project). En esta página se actualiza en vivo al escribir en #projectName (js/pages/descripcion.js).
                -->
                <span data-i18n="project">Proyecto:</span> <span id="projectNameText">(Sin nombre)</span>
            </div>
        </div>
        
        <div class="header-right">
            <!--
                Controles de cabecera: botón de tema y selector de idioma, ambos conectados por js/core/ (no por el script de la página).
            -->
            <div class="header-controls">
                <!--
                    id="themeToggle": lo conecta js/core/theme.js (PFM.theme.init, llamado desde PFM.page.init) para alternar claro/oscuro; guarda localStorage["theme"] (no renombrar esa clave). El title y el emoji se reescriben por JS según el tema.
                -->
                <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                    🌙
                </button>
                <!-- Selector de idioma. -->
                <div class="language-selector">
                    <!--
                        id="languageSelector": lo conecta js/core/page.js (PFM.page.init): refleja PFM.i18n.getLang() y al cambiar llama a PFM.i18n.setLanguage, que guarda localStorage["preferredLanguage"].
                    -->
                    <select id="languageSelector">
                        <!--
                            CONFIGURABLE: cada <option value> debe ser un código existente en PFM.translations (es, en). Para agregar un idioma: crear i18n/<lang>.js, cargarlo antes de core/i18n.js en TODOS los HTML y añadir aquí su option (ver cabecera de i18n/es.js).
                        -->
                        <option value="es">🇪🇸 Español</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO principal de la página (estilos en css/pages/descripcion.css). -->
    <div class="container">
        <!--
            data-i18n="description_data": en es.js vale "Descripción" (en: "Description"); el texto del HTML ("Criterios y pesos...") es un valor por defecto heredado que se sustituye al traducir.
        -->
        <h1 data-i18n="description_data">Criterios y pesos (la suma debe ser 10)</h1>

        <!-- Nombre del proyecto -->
        <div class="section">
            <!--
                id="projectName": js/pages/descripcion.js lo lee y guarda en projectData.projectName (con trim) y, al escribir, actualiza #projectNameText en la cabecera mediante header.updateProjectName. data-i18n-placeholder="enter_project_name": clave en es.js y en.js; el placeholder del HTML es el valor por defecto. CONFIGURABLE: no tiene maxlength ni required; para limitarlo añadir el atributo aquí (descripcion.js no valida).
            -->
            <label for="projectName" data-i18n="project_name">Nombre del proyecto</label>
            <input type="text" id="projectName" data-i18n-placeholder="enter_project_name" placeholder="Ingrese el nombre del proyecto">
        </div>

        <!-- Descripción del proyecto -->
        <div class="section">
            <label for="projectDescription" data-i18n="project_description">Descripción del proyecto</label>
            <!--
                id="projectDescription": js/pages/descripcion.js lo lee y guarda en projectDescription (con trim); lo imprime el PDF (sections/info-proyecto.js). CONFIGURABLE: rows="4" es la altura inicial; no hay maxlength. data-i18n-placeholder="enter_project_description": su valor en es.js difiere del texto por defecto del HTML.
            -->
            <textarea 
                id="projectDescription" 
                rows="4" 
                data-i18n-placeholder="enter_project_description" 
                placeholder="Describa el objetivo y detalles del proyecto..."
            ></textarea>
        </div>

        <!--
            MÓDULOS: cada tarjeta es un checkbox cuyo estado se guarda en projectData.modulosSeleccionados. Los textos (título y descripción) usan claves de i18n/es.js e i18n/en.js.
        -->
        <!-- Menú de selección de módulos -->
        <div class="section">
            <h2 data-i18n="modules_menu_title">Selecciona los módulos a realizar</h2>
            <p class="modules-subtitle" data-i18n="modules_menu_subtitle">Elige qué partes del proceso quieres completar. Solo esas páginas, resultados y secciones del PDF se incluirán.</p>

            <!--
                Lista de tarjetas de módulo. CONFIGURABLE: para agregar un módulo hay que sumar a la vez (1) su checkbox con id "mod-<clave>" aquí, (2) la entrada en MODULOS_OPCIONALES de js/pages/descripcion.js, (3) las filas de FLOW_STEPS en js/core/flow.js, (4) sus claves en i18n/es.js y en.js, y (5) enabled() de las secciones del PDF y ORDEN en js/pdf/report.js. CUIDADO: los ids mod-definicionIdeas, mod-diagrama, mod-exploracionConceptos y mod-prevencion no se deben renombrar: descripcion.js los busca por id y su parte final es la clave que usa FLOW_STEPS.
            -->
            <div class="modules-list">
                <label class="module-card module-card-required">
                    <!--
                        id="mod-analisisInicial": checked y disabled (módulo obligatorio). descripcion.js no lo lee (no figura en MODULOS_OPCIONALES): guarda analisisInicial: true siempre. data-i18n="module_required_badge" en el span siguiente: etiqueta "Obligatorio".
                    -->
                    <input type="checkbox" id="mod-analisisInicial" checked disabled>
                    <div class="module-card-text">
                        <span class="module-card-title" data-i18n="module_initial_analysis">Análisis Inicial</span>
                        <span class="module-card-desc" data-i18n="module_initial_analysis_desc">Criterios y pesos (necesidades del proyecto)</span>
                    </div>
                    <span class="module-badge" data-i18n="module_required_badge">Obligatorio</span>
                </label>

                <label class="module-card">
                    <!--
                        id="mod-definicionIdeas": activa en FLOW_STEPS las páginas ideas.html y evaluacion.html (clave modulosSeleccionados.definicionIdeas).
                    -->
                    <input type="checkbox" id="mod-definicionIdeas">
                    <div class="module-card-text">
                        <span class="module-card-title" data-i18n="module_definition_ideas">Definición y Análisis de Ideas</span>
                        <span class="module-card-desc" data-i18n="module_definition_ideas_desc">Ideas/conceptos iniciales y su evaluación</span>
                    </div>
                </label>

                <label class="module-card">
                    <!--
                        id="mod-diagrama": activa diagrama.html (clave modulosSeleccionados.diagrama). Las claves data-i18n diagram_question y ask_diagram están en es.js y en.js.
                    -->
                    <input type="checkbox" id="mod-diagrama">
                    <div class="module-card-text">
                        <span class="module-card-title" data-i18n="diagram_question">Diagrama de Actividades</span>
                        <span class="module-card-desc" data-i18n="ask_diagram">¿Quieres realizar los diagramas de funciones?</span>
                    </div>
                </label>

                <label class="module-card">
                    <!--
                        id="mod-exploracionConceptos": activa seleccionEvaluar.html (si además hay ideas o diagrama), morfologia.html, gc1.html y evalConceptos.html.
                    -->
                    <input type="checkbox" id="mod-exploracionConceptos">
                    <div class="module-card-text">
                        <span class="module-card-title" data-i18n="concept_question">Exploración y Evaluación de Conceptos</span>
                        <span class="module-card-desc" data-i18n="ask_concept">¿Deseas hacer la exploración y evaluación de conceptos?</span>
                    </div>
                </label>

                <label class="module-card">
                    <!-- id="mod-prevencion": activa prevenir.html (clave modulosSeleccionados.prevencion). -->
                    <input type="checkbox" id="mod-prevencion">
                    <div class="module-card-text">
                        <span class="module-card-title" data-i18n="prevention_question">Prevención de Riesgos</span>
                        <span class="module-card-desc" data-i18n="ask_prevention">¿Deseas realizar el análisis de prevención de riesgos?</span>
                    </div>
                </label>
            </div>
        </div>

        <!--
            BARRA DE BOTONES común: Guardar / Continuar / Regreso; los tres los conecta js/core/page.js (PFM.page.init).
        -->
        <div class="buttons">
            <!--
                id="guardarBtn": js/core/page.js lo enlaza a la función save() que la página pasa a PFM.page.init (la de js/pages/descripcion.js). CUIDADO: no renombrar los ids guardarBtn, continuarBtn y anteriorBtn, o dejan de funciónar en silencio.
            -->
            <button class="btn-primary" id="guardarBtn" data-i18n="save">Guardar</button>
            <!--
                id="continuarBtn": ejecuta save() y navega con PFM.flow.getNextPage("descripcion.html"), que sigue FLOW_STEPS según los módulos elegidos en descripcion.html.
            -->
            <button class="btn-primary" id="continuarBtn" data-i18n="continue">Continuar</button>
            <!--
                id="anteriorBtn": navega con PFM.flow.getPreviousPage("descripcion.html"); si es la primera página del flujo activo vuelve a index.html.
            -->
            <button class="btn-secondary" id="anteriorBtn" data-i18n="back">Regreso</button>
        </div>
    </div>

    <!--
        ORDEN DE LOS SCRIPTS - NO REORDENAR. Sin módulos ES (file://), cada archivo asume que los anteriores ya cargaron y se comunican por el objeto global PFM:
        1) i18n/es.js e i18n/en.js crean PFM.translations.es / .en.
        2) js/core/i18n.js lee PFM.translations al cargarse, por eso va después de los diccionarios.
        3) js/core/storage.js (sin dependencias): PFM.storage sobre localStorage['projectData'].
        4) js/core/theme.js usa PFM.i18n (claves theme_light y theme_dark).
        5) js/core/flow.js usa PFM.storage (lee modulosSeleccionados) y define FLOW_STEPS.
        6) js/core/page.js (PFM.page.init) usa i18n, storage, theme y flow, asi que va el ultimo del nucleo.
        Después van las utilidades de la página y, al final, su script, que llama a PFM.page.init en DOMContentLoaded.
    -->
    <!-- Núcleo compartido (el orden importa) -->
    <script src="i18n/es.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/html.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/flow.js"></script>
    <script src="js/core/page.js"></script>
    <!--
        Script propio de la página: va después de todo lo que usa (nucleo, utilidades) porque se ejecuta en cuanto carga y registra su DOMContentLoaded.
    -->
    <!-- Lógica de esta página -->
    <script src="js/pages/descripcion.js"></script>
</body>
</html>
