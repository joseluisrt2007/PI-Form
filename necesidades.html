<!DOCTYPE html>
<html lang="es">
<head>
    <!--
        PÁGINA: necesidades.html
        PROPÓSITO: captura de las necesidades (criterios) y su prioridad (peso) del proyecto; los pesos deben sumar 10 (solo se indica, no se bloquea).
        POSICIÓN EN EL FLUJO (js/core/flow.js, FLOW_STEPS): segundo paso de FLOW_STEPS (modulo "siempre"): siempre aparece, después de descripcion.html.
        CSS (en este orden): css/base.css primero (variables, cabecera, botones, tema oscuro) y después css/pages/necesidades.css con lo específico de la página; el segundo puede sobrescribir al primero, por eso no se invierten.
        SCRIPTS (al final del body, en orden de dependencia; ver el comentario antes de ellos): i18n/es.js, i18n/en.js, js/core/{i18n,storage,theme,flow,page}.js, js/core/file-io.js, js/pages/necesidades.js y js/features/assistant.js (data-page="necesidades").
        MÓDULOS DE LOS QUE DEPENDE: PFM.i18n, PFM.storage, PFM.theme, PFM.flow y PFM.page (js/core/). Además PFM.fileIO (guardar/cargar .txt). Los criterios y pesos que escribe (criterio1..5, peso1..5) los usan shared/scoring.js, evaluacion.js, evalConceptos.js y el PDF.
        TEXTOS: los elementos con data-i18n o data-i18n-placeholder usan una clave de i18n/es.js e i18n/en.js; el texto escrito en este HTML es solo el valor por defecto antes de traducir y puede diferir del texto final.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        data-i18n="criteria_weights" en el <title>: js/core/i18n.js reemplaza el texto de la pestaña con esa clave (i18n/es.js e i18n/en.js); el texto de aquí es el valor por defecto.
    -->
    <title data-i18n="criteria_weights">Criterios - Actividades de Mejora</title>
    <!--
        Fuente Roboto desde Google Fonts: los dos preconnect y el link de la hoja aceleran la descarga; requiere Internet, sin conexión el navegador usa una fuente alternativa.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- css/base.css va ANTES que la hoja propia de la página (la de la página sobrescribe a la base). -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/necesidades.css">
    <link rel="stylesheet" href="css/components/asistente.css">
</head>
<body>
    <!--
        CABECERA común a las páginas: tres zonas (izquierda reservada, centro con título y nombre de proyecto, derecha con tema e idioma). Estilos en css/base.css.
    -->
    <header role="banner">
        <div class="header-left">
            <!-- Espacio reservado para alineación -->
        </div>
        
        <!-- Zona central: título de la aplicación y nombre del proyecto en curso. -->
        <div class="header-center">
            <!--
                data-i18n="app_title": clave en i18n/es.js e i18n/en.js; el texto de aquí es el valor por defecto y se sustituye al traducir.
            -->
            <div class="app-title" data-i18n="app_title">Desarrollo de Formularios para Actividades de Mejora</div>
            <!--
                id="projectNameDisplay": contenedor del nombre de proyecto; ningún JS lo usa, solo css/base.css (.project-name-container).
            -->
            <div class="project-name-container" id="projectNameDisplay">
                <!--
                    data-i18n="project": etiqueta "Proyecto:" (clave en i18n/es.js e i18n/en.js). id="projectNameText": lo escribe js/core/page.js (updateProjectName) con projectData.projectName o "(Sin nombre)" traducido (clave unnamed_project).
                -->
                <span data-i18n="project">Proyecto:</span> <span id="projectNameText">(Sin nombre)</span>
            </div>
        </div>
        
        <div class="header-right">
            <!--
                Controles de cabecera: botón de tema y selector de idioma, ambos conectados por js/core/ (no por el script de la página).
            -->
            <div class="header-controls">
                <!--
                    id="themeToggle": lo conecta js/core/theme.js (PFM.theme.init, llamado desde PFM.page.init) para alternar claro/oscuro; guarda localStorage["theme"] (no renombrar esa clave). El title y el emoji se reescriben por JS según el tema.
                -->
                <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                    🌙
                </button>
                <!-- Selector de idioma. -->
                <div class="language-selector">
                    <!--
                        id="languageSelector": lo conecta js/core/page.js (PFM.page.init): refleja PFM.i18n.getLang() y al cambiar llama a PFM.i18n.setLanguage, que guarda localStorage["preferredLanguage"].
                    -->
                    <select id="languageSelector">
                        <!--
                            CONFIGURABLE: cada <option value> debe ser un código existente en PFM.translations (es, en). Para agregar un idioma: crear i18n/<lang>.js, cargarlo antes de core/i18n.js en TODOS los HTML y añadir aquí su option (ver cabecera de i18n/es.js).
                        -->
                        <option value="es">🇪🇸 Español</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!--
            data-i18n="criteria_weights": en es.js vale "Necesidades y prioridades"; el texto del HTML es solo el valor por defecto. La misma clave se repite en el h2 de la sección.
        -->
        <h1 data-i18n="criteria_weights">Criterios y pesos (la suma debe ser 10)</h1>

        <!-- Cargar / Guardar Necesidades en archivo .txt -->
        <!--
            BARRA DE ARCHIVO .txt (cargar/guardar necesidades); estilos .file-actions y .btn-file-action en css/pages/necesidades.css.
        -->
        <div class="file-actions">
            <!--
                id="cargarNecesidadesBtn": js/pages/necesidades.js lo usa para abrir el selector de archivos (hace clic en #cargarNecesidadesInput). id="cargarNecesidadesInput": input file oculto (accept .txt), lee el archivo con PFM.fileIO. id="guardarNecesidadesBtn": descarga las necesidades como .txt (formato NECESIDADES_PRIORIDADES_V1). Textos con data-i18n load_necesidades / save_necesidades.
            -->
            <button type="button" class="btn-secondary btn-file-action" id="cargarNecesidadesBtn" data-i18n="load_necesidades">📂 Cargar Necesidades</button>
            <input type="file" id="cargarNecesidadesInput" accept=".txt,text/plain" style="display:none">
            <button type="button" class="btn-secondary btn-file-action" id="guardarNecesidadesBtn" data-i18n="save_necesidades">💾 Guardar Necesidades</button>
        </div>

        <!-- TABLA DE CRITERIOS: 5 filas estáticas escritas a mano en este HTML (no las genera JS). -->
        <!-- Criterios y pesos -->
        <div class="section">
            <h2 data-i18n="criteria_weights">Criterios y pesos (la suma debe ser 10)</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th data-i18n="criteria">Criterio</th>
                        <th data-i18n="weight">Peso</th>
                    </tr>
                </thead>
                <!--
                    CONFIGURABLE: el número de filas (5) debe coincidir con NUM_CRITERIOS en js/pages/necesidades.js, js/shared/scoring.js, js/features/assistant.js, el arreglo fijo [1..5] de evaluacion.js, numCriterios en descripcion.js, evalConceptos.js, el PDF y api/assistant.js; para agregar una fila copiar una existente con el siguiente data-id y actualizar todos esos archivos. CUIDADO: la clase (criterio / peso) y data-id de cada input no se deben renombrar: necesidades.js los busca con .criterio[data-id=N] y .peso[data-id=N] y guarda criterioN y pesoN.
                -->
                <tbody>
                    <tr><td style="padding: 1rem; text-align: center; font-weight: 600;">1</td>
                        <!--
                            input.criterio[data-id=N]: texto del criterio N (necesidades.js lo guarda en criterioN, con trim). Sin maxlength. input.peso[data-id=N]: peso N, type=number, CONFIGURABLE min="0" step="0.1" (no hay max; la suma 10 no se valida).
                        -->
                        <td style="padding: 0;"><input type="text" class="criterio" data-id="1" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                        <td style="padding: 0;"><input type="number" class="peso" data-id="1" min="0" step="0.1" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 1rem; text-align: center; font-weight: 600;">2</td>
                        <td style="padding: 0;"><input type="text" class="criterio" data-id="2" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                        <td style="padding: 0;"><input type="number" class="peso" data-id="2" min="0" step="0.1" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 1rem; text-align: center; font-weight: 600;">3</td>
                        <td style="padding: 0;"><input type="text" class="criterio" data-id="3" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                        <td style="padding: 0;"><input type="number" class="peso" data-id="3" min="0" step="0.1" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 1rem; text-align: center; font-weight: 600;">4</td>
                        <td style="padding: 0;"><input type="text" class="criterio" data-id="4" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                        <td style="padding: 0;"><input type="number" class="peso" data-id="4" min="0" step="0.1" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding: 1rem; text-align: center; font-weight: 600;">5</td>
                        <td style="padding: 0;"><input type="text" class="criterio" data-id="5" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                        <td style="padding: 0;"><input type="number" class="peso" data-id="5" min="0" step="0.1" style="border: none; background: transparent; padding: 1rem; width: 100%;"></td>
                    </tr>
                </tbody>
            </table>
            <!--
                id="pesoError": js/pages/necesidades.js escribe aquí el aviso 'La suma de los pesos debe ser exactamente 10' (clave error_sum_weights) cuando los pesos no suman 10. CUIDADO: no eliminar; su estilo está en css/pages/necesidades.css (.error).
            -->
            <div class="error" id="pesoError"></div>
        </div>

        <!--
            BARRA DE BOTONES común: Guardar / Continuar / Regreso; los tres los conecta js/core/page.js (PFM.page.init).
        -->
        <div class="buttons">
            <!--
                id="guardarBtn": js/core/page.js lo enlaza a la función save() que la página pasa a PFM.page.init (la de js/pages/necesidades.js). CUIDADO: no renombrar los ids guardarBtn, continuarBtn y anteriorBtn, o dejan de funciónar en silencio.
            -->
            <button class="btn-primary" id="guardarBtn" data-i18n="save">Guardar</button>
            <!--
                id="continuarBtn": ejecuta save() y navega con PFM.flow.getNextPage("necesidades.html"), que sigue FLOW_STEPS según los módulos elegidos en descripcion.html.
            -->
            <button class="btn-primary" id="continuarBtn" data-i18n="continue">Continuar</button>
            <!--
                id="anteriorBtn": navega con PFM.flow.getPreviousPage("necesidades.html"); si es la primera página del flujo activo vuelve a index.html.
            -->
            <button class="btn-secondary" id="anteriorBtn" data-i18n="back">Regreso</button>
        </div>
    </div>

    <!--
        ORDEN DE LOS SCRIPTS - NO REORDENAR. Sin módulos ES (file://), cada archivo asume que los anteriores ya cargaron y se comunican por el objeto global PFM:
        1) i18n/es.js e i18n/en.js crean PFM.translations.es / .en.
        2) js/core/i18n.js lee PFM.translations al cargarse, por eso va después de los diccionarios.
        3) js/core/storage.js (sin dependencias): PFM.storage sobre localStorage['projectData'].
        4) js/core/theme.js usa PFM.i18n (claves theme_light y theme_dark).
        5) js/core/flow.js usa PFM.storage (lee modulosSeleccionados) y define FLOW_STEPS.
        6) js/core/page.js (PFM.page.init) usa i18n, storage, theme y flow, asi que va el ultimo del nucleo.
        Después van las utilidades de la página y, al final, su script, que llama a PFM.page.init en DOMContentLoaded.
    -->
    <!-- Núcleo compartido (el orden importa) -->
    <script src="i18n/es.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/html.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/flow.js"></script>
    <script src="js/core/page.js"></script>
    <!--
        Utilidades compartidas: js/core/file-io.js (PFM.fileIO: descargar y leer .txt) depende de PFM.i18n (clave error_loading_file), por eso va después de i18n.js.
    -->
    <!-- Utilidades compartidas -->
    <script src="js/core/file-io.js"></script>
    <!--
        Script propio de la página: va después de todo lo que usa (nucleo, utilidades) porque se ejecuta en cuanto carga y registra su DOMContentLoaded.
    -->
    <!-- Lógica de esta página -->
    <script src="js/pages/necesidades.js"></script>
    <!--
        js/features/assistant.js: se carga al final porque usa PFM.storage y PFM.page.importText (que define necesidades.js para volcar el texto del asistente al formulario). data-page="necesidades" lo lee con document.currentScript; valores válidos: necesidades, ideas, evaluacion. Requiere /api/assistant desplegado (Vercel); sin él la página funciona igual. CUIDADO: sin data-page el widget no se crea.
    -->
    <!-- Asistente IA (opcional): requiere /api/assistant desplegado -->
    <script src="js/features/assistant.js" data-page="necesidades"></script>
</body>
</html>
